{% assign courses = site.teaching | sort: 'date' | reverse %}
{% for course in courses %}
<div class="bs-cv-entry"><span>{{ course.date | date: '%Y' }}</span><div><h3><a href="{{ course.url | relative_url }}">{{ course.course_code }} · {{ course.course_title | escape }}</a></h3><p>Teaching Assistant · {{ course.venue | escape }}</p><p>Instructor: {{ course.instructor | escape }}</p></div></div>
{% endfor %}
